<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My AI Chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 15px; }
    #chat { min-height: 300px; border: 1px solid #ccc; padding: 15px; overflow-wrap: anywhere; }
    .user { color: #1657c0; }
    .bot { color: #187044; }
    form { display: flex; gap: 8px; margin-top: 15px; }
    input { flex: 1; padding: 12px; min-width: 0; }
    button { padding: 12px; }
  </style>
</head>
<body>
  <h1>🤖 My AI Chat</h1>
  <div id="chat"></div>

  <form id="form">
    <input id="question" placeholder="Ask anything..." required>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const question = document.getElementById("question");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(label, text, className) {
      const p = document.createElement("p");
      p.className = className;
      p.textContent = label + ": " + text;
      chat.appendChild(p);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!text) return;

      addMessage("You", text, "user");
      question.value = "";
      send.disabled = true;

      try {
        const response = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Something went wrong");
        addMessage("AI", data.answer, "bot");
      } catch (error) {
        addMessage("Error", error.message, "bot");
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
